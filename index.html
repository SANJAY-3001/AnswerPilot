<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AnswerPilot</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="main-container">
            <header>
                <div class="brand">
                    <img src="images/logo.png">
                    <span class="brand-name">Answer Pilot</span>
                </div>
                <h1>Turn tough interview questions into clear answers.</h1>
            </header>

            <main>
                <section class="prompt-section">
                    <form>
                        <textarea
                        id="user-input"
                        class="user-input"
                        placeholder="Ask the interview questions you to want clear. Ex : What is inheritane ?"
                        ></textarea>
                        <button class="btn primary-btn">Generate my answer</button>
                    </form>
                </section>
            </main>
        </div>
    </body>
    <script type="module" src="script.js"></script>
</html>
