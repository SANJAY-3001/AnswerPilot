<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AnswerPilot</title>
        <link rel="stylesheet" href="src/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="main-container">
            <header>
                <div class="brand">
                    <img src="images/logo.png">
                    <span class="brand-name">Answer Pilot</span>
                </div>
                <h1>Turn tough interview questions into clear answers.</h1>
            </header>

            <main>
                <section class="prompt-section">
                    <form>
                        <textarea
                        id="user-input"
                        class="user-input"
                        placeholder="Ask the interview questions you to want clear. Ex : What is inheritane ?"
                        ></textarea>
                        <button class="btn primary-btn" id="get-answer">
                            <div class="btn-loader hidden" id="btn-loader"></div>
                            <span class="btn-text" id="btn-text">Generate my answer</span> 
                        </button>
                    </form>
                </section>
                <section class="answer-section">
                    <h2>Your Answer</h2>

                    <div class="loader hidden" id="loader"></div>

                    <div class="output-container hidden" id="output-container">
                        <button class="btn copy-btn" id="copy-btn">
                            <img src="images/copy-icon.png">
                            <span>Copy</span>
                        </button>

                        <p class="placeholder-text" id="placeholder-text">Answering....</p>

                        <div class="output-content" id="output-content">
                            
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
    <script type="module" src="src/script.js"></script>
</html>
